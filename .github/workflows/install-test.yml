# Walks through the prerequisites on fresh GitHub-hosted Windows and macOS machines.
# Runs when this file changes, or manually from the Actions tab. Does not deploy anything.
name: Install test (prerequisites)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/install-test.yml]

permissions:
  contents: read

env:
  SITE: https://preislet.github.io/miracle-winter-academy-2026
  R_PKGS: "'tidyverse','here','testthat','bench','renv','reticulate'"

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Pre-installed state (Git, R, conda, Claude)
        id: s01
        continue-on-error: true
        shell: pwsh
        run: |
          git --version
          foreach ($c in 'R','Rscript','conda','claude') { "{0}: {1}" -f $c, ((Get-Command $c -ErrorAction SilentlyContinue).Source ?? 'not found') }
          $h = (git config --show-origin --get-all credential.helper) -join ' ; '
          Write-Output "::notice title=Windows Git credential helper::$h"

      - name: R from CRAN (Windows installer, defaults)
        id: s02
        continue-on-error: true
        shell: pwsh
        run: |
          $f = [regex]::Match((Invoke-WebRequest https://cloud.r-project.org/bin/windows/base/release.html).Content, 'R-[0-9.]+-win\.exe').Value
          Invoke-WebRequest "https://cloud.r-project.org/bin/windows/base/$f" -OutFile $f
          Start-Process -Wait -FilePath ".\$f" -ArgumentList '/VERYSILENT','/NORESTART'
          $rs = (Get-ChildItem 'C:\Program Files\R\*\bin\Rscript.exe' | Sort-Object FullName | Select-Object -Last 1).FullName
          "RSCRIPT=$rs" >> $env:GITHUB_ENV
          & $rs --version

      - name: Course R packages (personal library)
        id: s03
        continue-on-error: true
        shell: pwsh
        run: |
          & $env:RSCRIPT -e "lib <- Sys.getenv('R_LIBS_USER'); dir.create(lib, recursive = TRUE, showWarnings = FALSE); .libPaths(lib); install.packages(c($env:R_PKGS), repos = 'https://cloud.r-project.org')"
          & $env:RSCRIPT -e "lib <- Sys.getenv('R_LIBS_USER'); .libPaths(lib); pkgs <- c($env:R_PKGS); m <- pkgs[!vapply(pkgs, requireNamespace, logical(1), quietly = TRUE)]; if (length(m)) { message('Missing: ', paste(m, collapse = ', ')); quit(status = 1) } else message('R packages OK')"

      - name: Advanced R (BiocManager + zellkonverter)
        id: s04
        continue-on-error: true
        shell: pwsh
        run: |
          & $env:RSCRIPT -e "lib <- Sys.getenv('R_LIBS_USER'); .libPaths(lib); install.packages('BiocManager', repos = 'https://cloud.r-project.org'); BiocManager::install(c('SingleCellExperiment', 'zellkonverter', 'rhdf5', 'HDF5Array'), ask = FALSE, update = FALSE)"
          & $env:RSCRIPT -e "lib <- Sys.getenv('R_LIBS_USER'); .libPaths(lib); quit(status = !all(sapply(c('zellkonverter', 'rhdf5', 'HDF5Array'), requireNamespace, quietly = TRUE)))"

      - name: Miniforge (Just Me, default location) + conda init bash
        id: s05
        continue-on-error: true
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-Windows-x86_64.exe -OutFile Miniforge3-Windows-x86_64.exe
          Start-Process -Wait -FilePath .\Miniforge3-Windows-x86_64.exe -ArgumentList '/InstallationType=JustMe','/S',"/D=$env:USERPROFILE\miniforge3"
          & "$env:USERPROFILE\miniforge3\Scripts\conda.exe" --version
          & "$env:USERPROFILE\miniforge3\Scripts\conda.exe" init bash

      - name: conda in a new Git Bash window
        id: s06
        continue-on-error: true
        shell: bash
        run: unset CONDA; bash -lic 'command -v conda && conda --version'

      - name: Course environment from the live site (Git Bash)
        id: s07
        continue-on-error: true
        shell: bash
        run: unset CONDA; bash -lic "cd ~ && curl -sL -O $SITE/prerequisites/environment.yml && conda env create -q -f environment.yml && conda activate miracle && python -c 'import scanpy; print(\"scanpy OK\")'"

      - name: Setup-check command for Python (Git Bash)
        id: s08
        continue-on-error: true
        shell: bash
        run: unset CONDA; bash -lic "conda run -n miracle python -c 'import scanpy, anndata, leidenalg; print(\"Python OK\")'"

      - name: Advanced Python (scvi-tools + muon)
        id: s09
        continue-on-error: true
        shell: bash
        run: unset CONDA; bash -lic "conda activate miracle && conda install -q -y -c conda-forge scvi-tools muon && python -c 'import scvi, muon; print(\"scvi-tools and muon OK\")'"

      - name: Claude Code installer (PowerShell)
        id: s10
        continue-on-error: true
        shell: pwsh
        run: irm https://claude.ai/install.ps1 | iex

      - name: claude in a new terminal (PowerShell and Git Bash)
        id: s11
        continue-on-error: true
        shell: pwsh
        run: |
          # a new window gets PATH from the registry, not from this process
          $env:Path = [Environment]::GetEnvironmentVariable('Path','Machine') + ';' + [Environment]::GetEnvironmentVariable('Path','User')
          $has = [Environment]::GetEnvironmentVariable('Path','User') -like '*\.local\bin*'
          Write-Output "::notice title=Windows claude PATH::User PATH contains .local\bin = $has"
          Get-Command claude -ErrorAction Stop | Select-Object -ExpandProperty Source
          claude --version
          & 'C:\Program Files\Git\bin\bash.exe' -lc 'command -v claude && claude --version'
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: claude after the guide's PATH step (Windows)
        id: s99
        continue-on-error: true
        shell: pwsh
        run: |
          [Environment]::SetEnvironmentVariable('Path', [Environment]::GetEnvironmentVariable('Path', 'User') + ";$env:USERPROFILE\.local\bin", 'User')
          $env:Path = [Environment]::GetEnvironmentVariable('Path','Machine') + ';' + [Environment]::GetEnvironmentVariable('Path','User')
          Get-Command claude -ErrorAction Stop | Select-Object -ExpandProperty Source
          claude --version
          & 'C:\Program Files\Git\bin\bash.exe' -lc 'command -v claude && claude --version'
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Report step outcomes
        if: always()
        shell: bash
        run: echo "::notice title=Step outcomes (windows)::${{ steps.s99.outcome }} | claude after the guide's PATH step (Windows)%0A${{ steps.s01.outcome }} | Pre-installed state (Git, R, conda, Claude)%0A${{ steps.s02.outcome }} | R from CRAN (Windows installer, defaults)%0A${{ steps.s03.outcome }} | Course R packages (personal library)%0A${{ steps.s04.outcome }} | Advanced R (BiocManager + zellkonverter)%0A${{ steps.s05.outcome }} | Miniforge (Just Me, default location) + conda init bash%0A${{ steps.s06.outcome }} | conda in a new Git Bash window%0A${{ steps.s07.outcome }} | Course environment from the live site (Git Bash)%0A${{ steps.s08.outcome }} | Setup-check command for Python (Git Bash)%0A${{ steps.s09.outcome }} | Advanced Python (scvi-tools + muon)%0A${{ steps.s10.outcome }} | Claude Code installer (PowerShell)%0A${{ steps.s11.outcome }} | claude in a new terminal (PowerShell and Git Bash)"
  macos:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Pre-installed state
        id: s12
        continue-on-error: true
        run: |
          sw_vers; uname -m
          for c in R Rscript conda claude git; do printf '%s: %s\n' "$c" "$(command -v $c || echo 'not found')"; done
          stat -f "home of runner: %Sp %Su:%Sg" ~

      - name: Create miracle-course (standard user)
        id: s13
        continue-on-error: true
        run: |
          sudo sysadminctl -addUser miracle-course -fullName "MIRACLE Course" -password 'Miracle-Test-2026' -home /Users/miracle-course
          sudo createhomedir -c -u miracle-course >/dev/null
          id miracle-course
          if dseditgroup -o checkmember -m miracle-course admin | grep -q "is a member"; then echo "is admin"; exit 1; fi
          echo "standard user: OK"

      - name: R from CRAN (.pkg)
        id: s16
        continue-on-error: true
        run: |
          pkg=$(curl -s https://cloud.r-project.org/bin/macosx/ | grep -oE 'sonoma-arm64/base/R-[0-9.]+-arm64\.pkg' | head -1)
          curl -sL -o /tmp/R.pkg "https://cloud.r-project.org/bin/macosx/$pkg"
          sudo installer -pkg /tmp/R.pkg -target / >/dev/null
          R --version | head -1

      - name: Course R packages as miracle-course (personal library)
        id: s17
        continue-on-error: true
        run: |
          cd /tmp
          sudo -u miracle-course -i Rscript -e "lib <- Sys.getenv('R_LIBS_USER'); dir.create(lib, recursive = TRUE, showWarnings = FALSE); .libPaths(lib); install.packages(c($R_PKGS), repos = 'https://cloud.r-project.org')" >/tmp/rpkg.log 2>&1
          sudo -u miracle-course -i Rscript -e "pkgs <- c($R_PKGS); m <- pkgs[!vapply(pkgs, requireNamespace, logical(1), quietly = TRUE)]; if (length(m)) { message('Missing: ', paste(m, collapse = ', ')); quit(status = 1) } else message('R packages OK')"

      - name: Advanced R as miracle-course (zellkonverter)
        id: s18
        continue-on-error: true
        run: |
          cd /tmp
          sudo -u miracle-course -i Rscript -e "install.packages('BiocManager', repos = 'https://cloud.r-project.org'); BiocManager::install(c('SingleCellExperiment', 'zellkonverter', 'rhdf5', 'HDF5Array'), ask = FALSE, update = FALSE)" >/tmp/bioc.log 2>&1
          sudo -u miracle-course -i Rscript -e "quit(status = !all(sapply(c('zellkonverter', 'rhdf5', 'HDF5Array'), requireNamespace, quietly = TRUE)))"

      - name: Git as miracle-course
        id: s19
        continue-on-error: true
        run: cd /tmp && sudo -u miracle-course -i git --version

      - name: Miniforge as miracle-course (guide commands, init = yes)
        id: s20
        continue-on-error: true
        run: |
          cd /tmp
          sudo -u miracle-course -i bash -c 'curl -sL -O "https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-$(uname)-$(uname -m).sh" && bash Miniforge3-$(uname)-$(uname -m).sh -b && ~/miniforge3/bin/conda init zsh'

      - name: conda in a new zsh window
        id: s21
        continue-on-error: true
        run: cd /tmp && sudo -u miracle-course -i zsh -ic 'command -v conda && conda --version'

      - name: Course environment from the live site
        id: s22
        continue-on-error: true
        run: |
          cd /tmp
          sudo -u miracle-course -i zsh -ic "curl -sL -O $SITE/prerequisites/environment.yml && conda env create -q -f environment.yml && conda activate miracle && python -c 'import scanpy; print(\"scanpy OK\")'"

      - name: Setup-check command for Python
        id: s23
        continue-on-error: true
        run: cd /tmp && sudo -u miracle-course -i zsh -ic "conda run -n miracle python -c 'import scanpy, anndata, leidenalg; print(\"Python OK\")'"

      - name: Advanced Python (scvi-tools + muon)
        id: s24
        continue-on-error: true
        run: cd /tmp && sudo -u miracle-course -i zsh -ic "conda activate miracle && conda install -q -y -c conda-forge scvi-tools muon && python -c 'import scvi, muon; print(\"scvi-tools and muon OK\")'"

      - name: Claude Code installer as miracle-course
        id: s25
        continue-on-error: true
        run: cd /tmp && sudo -u miracle-course -i bash -c 'curl -fsSL https://claude.ai/install.sh | bash'

      - name: claude in a new zsh window (before the PATH step)
        id: s26
        continue-on-error: true
        run: cd /tmp && sudo -u miracle-course -i zsh -ic 'command -v claude && claude --version'

      - name: claude after the guide's PATH step
        id: s27
        continue-on-error: true
        run: |
          cd /tmp
          sudo -u miracle-course -i zsh -c "echo 'export PATH=\"\$HOME/.local/bin:\$PATH\"' >> ~/.zshrc"
          sudo -u miracle-course -i zsh -ic 'command -v claude && claude --version'

      - name: Report step outcomes
        if: always()
        run: echo "::notice title=Step outcomes (macos)::${{ steps.s12.outcome }} | Pre-installed state%0A${{ steps.s13.outcome }} | Create miracle-course (standard user)%0A${{ steps.s16.outcome }} | R from CRAN (.pkg)%0A${{ steps.s17.outcome }} | Course R packages as miracle-course (personal library)%0A${{ steps.s18.outcome }} | Advanced R as miracle-course (zellkonverter)%0A${{ steps.s19.outcome }} | Git as miracle-course%0A${{ steps.s20.outcome }} | Miniforge as miracle-course (guide commands, init = yes)%0A${{ steps.s21.outcome }} | conda in a new zsh window%0A${{ steps.s22.outcome }} | Course environment from the live site%0A${{ steps.s23.outcome }} | Setup-check command for Python%0A${{ steps.s24.outcome }} | Advanced Python (scvi-tools + muon)%0A${{ steps.s25.outcome }} | Claude Code installer as miracle-course%0A${{ steps.s26.outcome }} | claude in a new zsh window (before the PATH step)%0A${{ steps.s27.outcome }} | claude after the guide's PATH step"
